[package]
name = "snarkjs-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Reads snarkjs keys and proofs, checks them with arkworks, and converts them for groth16-solana"

[dependencies]
ark-bn254 = { workspace = true, features = ["std"] }
ark-ff = { workspace = true, features = ["std"] }
ark-ec = { workspace = true, features = ["std"] }
ark-groth16 = { workspace = true, features = ["std"] }
mirror-circuit.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
