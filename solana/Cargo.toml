[workspace]
resolver = "2"
members = ["crates/snarkjs-bridge", "programs/compliance"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# Versions pinned to match mirror-pool, so both programs build against the same runtime.
ark-bn254 = { version = "0.5", default-features = false, features = ["curve"] }
ark-ff = { version = "0.5", default-features = false }
ark-ec = { version = "0.5", default-features = false }
ark-groth16 = { version = "0.5", default-features = false }
groth16-solana = "0.2"
solana-program = "4.0"
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
litesvm = "0.15"
solana-keypair = "3.1"
solana-signer = "3"
solana-transaction = { version = "4.1", features = ["serde", "wincode"] }
solana-message = "4.2"
mirror-circuit = { path = "../mirror-pool/crates/mirror-circuit" }
snarkjs-bridge = { path = "crates/snarkjs-bridge" }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
