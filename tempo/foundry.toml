[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib", "node_modules"]
solc_version = "0.8.30"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
ffi = true
fs_permissions = [
    { access = "read", path = "./test/fixtures" },
    { access = "read", path = "../circuits/test" },
]
remappings = [
    "forge-std/=lib/forge-std/src/",
    "tempo-std/=lib/tempo-std/src/",
    "poseidon-solidity/=node_modules/poseidon-solidity/",
]
