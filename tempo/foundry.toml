[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib", "node_modules"]
solc_version = "0.8.30"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
ffi = true
fs_permissions = [
    { access = "read", path = "./test/fixtures" },
    { access = "read", path = "../circuits/test" },
    { access = "read-write", path = "./deployments" },
]
remappings = [
    "forge-std/=lib/forge-std/src/",
    "tempo-std/=lib/tempo-std/src/",
    "poseidon-solidity/=node_modules/poseidon-solidity/",
]

[fmt]
# The two deployed contracts stay byte-for-byte as deployed: the bytecode on
# Moderato embeds the hash of this exact source, and CI checks that match
# (.github/workflows/deployments.yml). The verifier is also generated by snarkjs.
ignore = ["src/CompliantPool.sol", "src/Groth16Verifier.sol"]
