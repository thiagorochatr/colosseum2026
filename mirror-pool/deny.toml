# Supply-chain policy, enforced in CI by `cargo deny check`.
#
# A privacy protocol's dependency tree is part of its threat surface: a
# compromised transitive crate in the proving path sees the witness, and one in
# the client sees the note. The point of this file is not to reach a green tick
# — it is that every exception below has to be written down with a reason
# somebody can argue with.

[advisories]
version = 2
# No blanket ignores. Every entry below is an *unmaintained* notice — not a
# vulnerability — and each carries the reason it does not reach anything this
# protocol depends on. An advisory with a security impact gets fixed, not listed.
ignore = [
    # ansi_term — terminal colour codes, reached only through the CLI's argument
    # parser. It touches no key, no note and no proof, and its whole surface is
    # writing escape sequences to a terminal this project controls.
    { id = "RUSTSEC-2021-0139", reason = "unmaintained; terminal colouring in the CLI, not on any cryptographic or custody path" },

    # derivative — a proc-macro arkworks uses to derive traits. It runs at
    # compile time and emits no code of its own into the binary, so
    # "unmaintained" here means the macro will not gain features, not that
    # anything ships.
    { id = "RUSTSEC-2024-0388", reason = "unmaintained; compile-time proc-macro from arkworks, contributes no runtime code" },

    # paste — the same situation: a compile-time token-pasting macro pulled in
    # transitively. Nothing of it exists at runtime.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained; compile-time proc-macro, contributes no runtime code" },

    # bincode 1.3 — this one *is* on the path, and is listed rather than waved
    # away: it serializes transactions in `chain.rs`. It stays because the wire
    # format it implements is fixed by the Solana runtime and cannot change
    # without the cluster changing, and because every crate in the ecosystem that
    # builds a transaction depends on the same version. "Unmaintained" for a
    # frozen format is a statement about the crate's future, not its behaviour.
    { id = "RUSTSEC-2025-0141", reason = "unmaintained; implements a wire format frozen by the Solana runtime, and is the version the whole ecosystem pins" },

    # libsecp256k1 — arrives through `solana-program`'s secp256k1 recovery
    # support. This program verifies Groth16 over BN254 and never calls a
    # secp256k1 entry point; `grep` for one across the workspace finds nothing.
    { id = "RUSTSEC-2025-0161", reason = "unmaintained; transitive through solana-program's secp256k1 support, which this workspace never calls" },
]

[licenses]
version = 2
# Permissive only. This repository is MIT and a copyleft dependency anywhere in
# the tree would make that claim false.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    # The Mozilla CA root store, carried by `webpki-roots`. CDLA-Permissive-2.0
    # is a *data* licence — it governs the certificate list, not code, imposes no
    # copyleft and no attribution requirement on downstream use. It is here
    # because a TLS client needs roots from somewhere, and taking them from
    # Mozilla's published store is better than pinning our own.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The wildcards this would otherwise reject are the workspace's own crates
# depending on each other by path. They are in this repository, they are built
# from this commit, and there is no registry version for them to drift to.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Every dependency comes from crates.io. A git dependency is a version nobody
# else can resolve and an audit nobody else can repeat.
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
